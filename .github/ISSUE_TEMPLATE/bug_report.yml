name: Bug report
description: Report a reproducible Pilot problem using non-personal data.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the route, expected result, and actual result. Do not attach personal photos, calendar text, tokens, or signed URLs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the smallest sequence that reproduces the issue in demo mode when possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data, secrets, signed URLs, and private media.
          required: true
